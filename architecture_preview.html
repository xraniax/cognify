<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cognify Architecture Diagram</title>
<style>
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  .wrapper { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 1200px; width: 100%; }
  h2 { text-align: center; color: #333; margin-bottom: 32px; font-size: 1.4rem; letter-spacing: 0.03em; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body>
<div class="wrapper">
  <h2>General Architecture of the Cognify Platform</h2>
  <svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" width="100%">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
      </marker>
      <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
      </marker>
    </defs>

    <!-- ── INPUT ── -->
    <rect x="20" y="60" width="160" height="200" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="85" text-anchor="middle" font-weight="bold" font-size="13" fill="#1d4ed8">INPUT</text>
    <rect x="35" y="100" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="100" y="122" text-anchor="middle" font-size="12" fill="#334155">Client (React)</text>
    <rect x="35" y="145" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="100" y="167" text-anchor="middle" font-size="12" fill="#334155">API Gateway</text>
    <rect x="35" y="190" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="100" y="212" text-anchor="middle" font-size="12" fill="#334155">JWT / OAuth2</text>

    <!-- arrow INPUT → ORCHESTRATION -->
    <line x1="180" y1="160" x2="218" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ── ORCHESTRATION ── -->
    <rect x="220" y="60" width="170" height="200" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="85" text-anchor="middle" font-weight="bold" font-size="13" fill="#5b21b6">ORCHESTRATION</text>
    <rect x="235" y="100" width="140" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="305" y="122" text-anchor="middle" font-size="12" fill="#334155">Express Router</text>
    <rect x="235" y="145" width="140" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="305" y="167" text-anchor="middle" font-size="12" fill="#334155">material.service</text>
    <rect x="235" y="190" width="140" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="305" y="212" text-anchor="middle" font-size="12" fill="#334155">exam.service</text>

    <!-- arrow ORCHESTRATION → ENGINE -->
    <line x1="390" y1="160" x2="428" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ── ENGINE CORE ── -->
    <rect x="430" y="40" width="480" height="240" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="670" y="65" text-anchor="middle" font-weight="bold" font-size="14" fill="#15803d">ENGINE CORE</text>

    <!-- RAG Pipeline sub-group -->
    <text x="520" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">RAG Pipeline</text>
    <rect x="450" y="100" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="520" y="121" text-anchor="middle" font-size="11.5" fill="#334155">Ingestion / OCR</text>
    <rect x="450" y="142" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="520" y="163" text-anchor="middle" font-size="11.5" fill="#334155">Chunking</text>
    <rect x="450" y="184" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="520" y="205" text-anchor="middle" font-size="11.5" fill="#334155">nomic-embed</text>

    <!-- Generation sub-group -->
    <text x="670" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Generation</text>
    <rect x="600" y="100" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="670" y="121" text-anchor="middle" font-size="11.5" fill="#334155">summary</text>
    <rect x="600" y="142" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="670" y="163" text-anchor="middle" font-size="11.5" fill="#334155">flashcard / quiz</text>
    <rect x="600" y="184" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="670" y="205" text-anchor="middle" font-size="11.5" fill="#334155">mock exam</text>

    <!-- Tools sub-group -->
    <text x="820" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Tools</text>
    <rect x="750" y="100" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="820" y="121" text-anchor="middle" font-size="11.5" fill="#334155">chat.service</text>
    <rect x="750" y="142" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="820" y="163" text-anchor="middle" font-size="11.5" fill="#334155">goal.service</text>
    <rect x="750" y="184" width="140" height="32" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="820" y="205" text-anchor="middle" font-size="11.5" fill="#334155">adaptive profile</text>

    <!-- arrow ENGINE → OUTPUT -->
    <line x1="910" y1="160" x2="948" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- ── OUTPUT ── -->
    <rect x="950" y="60" width="160" height="200" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="1030" y="85" text-anchor="middle" font-weight="bold" font-size="13" fill="#1d4ed8">OUTPUT</text>
    <rect x="965" y="100" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1030" y="122" text-anchor="middle" font-size="12" fill="#334155">SSE Streaming</text>
    <rect x="965" y="145" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1030" y="167" text-anchor="middle" font-size="12" fill="#334155">Job Status</text>
    <rect x="965" y="190" width="130" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1030" y="212" text-anchor="middle" font-size="11.5" fill="#334155">Generated Material</text>

    <!-- ── dashed async arrow ORCHESTRATION → INFRA ── -->
    <line x1="305" y1="260" x2="305" y2="350" stroke="#999" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
    <text x="315" y="315" font-size="10.5" fill="#888" font-style="italic">async</text>

    <!-- ── INFRA / WORKER ── -->
    <rect x="60" y="355" width="580" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="350" y="378" text-anchor="middle" font-weight="bold" font-size="13" fill="#334155">INFRA / WORKER</text>
    <rect x="80" y="388" width="155" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="157" y="410" text-anchor="middle" font-size="11.5" fill="#334155">Redis (Celery broker)</text>
    <rect x="263" y="388" width="135" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="330" y="410" text-anchor="middle" font-size="11.5" fill="#334155">Celery Worker</text>
    <rect x="426" y="388" width="195" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="523" y="410" text-anchor="middle" font-size="11.5" fill="#334155">PostgreSQL + pgvector</text>

    <!-- arrow inside INFRA -->
    <line x1="235" y1="405" x2="261" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="398" y1="405" x2="424" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ── MODELS ── -->
    <rect x="720" y="355" width="310" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="875" y="378" text-anchor="middle" font-weight="bold" font-size="13" fill="#92400e">MODELS</text>
    <rect x="738" y="388" width="160" height="34" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="818" y="410" text-anchor="middle" font-size="11.5" fill="#334155">qwen2.5:3b · Ollama</text>
    <rect x="918" y="388" width="95" height="34" rx="6" fill="white" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="965" y="403" text-anchor="middle" font-size="11" fill="#334155">fallback</text>
    <text x="965" y="416" text-anchor="middle" font-size="11" fill="#334155">(local)</text>
    <!-- dashed arrow between models -->
    <line x1="898" y1="405" x2="916" y2="405" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>

    <!-- arrow ENGINE → MODELS (LLM inference) -->
    <line x1="670" y1="280" x2="670" y2="348" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="680" y="320" font-size="10.5" fill="#555" font-style="italic">LLM inference</text>

    <!-- arrow INFRA → MODELS (pgvector) -->
    <line x1="640" y1="410" x2="718" y2="410" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="672" y="402" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">pgvector</text>

    <!-- caption -->
    <text x="550" y="500" text-anchor="middle" font-size="12.5" fill="#64748b" font-style="italic">Figure — General Architecture of the Cognify Platform</text>
  </svg>
</div>
</body>
</html>
